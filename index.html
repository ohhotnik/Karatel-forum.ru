<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARATEL TEST - Форум</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;color:#fff;background:#0f1115}
.wrap{max-width:600px;margin:0 auto;padding:12px}
.logo{font-size:32px;font-weight:900;text-align:center;padding:12px}
.logo span{background:#ff0000;padding:4px 12px;border-radius:8px}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px 0;border-bottom:2px solid #333}
.nav button{background:#222;border:none;color:#fff;font-weight:700;padding:8px 12px;border-radius:20px;cursor:pointer}
.nav button.active{background:#ff0000}
.box{background:#161920;border-radius:16px;padding:16px;margin:12px 0}
.box input,.box textarea,.box select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:8px 0}
.box button{width:100%;padding:12px;background:#ff7a00;color:#fff;border:none;border-radius:10px;font-weight:900;cursor:pointer;margin:4px 0}
.user-card{background:#1a1d24;border-radius:14px;padding:14px;margin:10px 0}
.rank{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:900;border:2px solid #ff0000;color:#ff2222}
.rank-admin{border-color:#00aaff;color:#00aaff}
.rank-helper{border-color:#2ecc71;color:#2ecc71}
.topic{background:#000;border-radius:12px;padding:12px;margin:10px 0;border-left:4px solid #ff7a00}
.topic.closed{border-left-color:#ff0000}
.chat-box{height:180px;overflow-y:auto;background:#000;border-radius:12px;padding:10px;margin:10px 0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:99;padding:16px;overflow-y:auto}
.modal-inner{max-width:520px;margin:10px auto;background:#161920;border-radius:16px;padding:18px;border:2px solid #ff0000}
.small-btn{padding:7px 10px!important;width:auto!important;font-size:12px!important;display:inline-block!important;margin:2px!important}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">KARATEL <span>TEST</span></div>

<div class="nav">
<button onclick="showPage('online',this)" class="active">🟢 Кто в сети</button>
<button onclick="showPage('admin',this)">Администрация</button>
<button onclick="showPage('create',this)">Создать тему</button>
<button onclick="showPage('profile',this)">Профиль</button>
<button onclick="showPage('zayavki',this)">📝 Подать заявку</button>
</div>

<div id="page-online"><div class="box"><h2>🟢 КТО В СЕТИ</h2><div id="onlineList"></div></div></div>
<div id="page-admin" style="display:none;"><div class="box"><h2>👑 Администрация</h2><div id="adminList"></div></div></div>
<div id="page-create" style="display:none;"><div class="box"><h2>✏️ Создать тему</h2><input id="topicTitle" placeholder="Название темы"><textarea id="topicText" placeholder="Текст темы..." rows="3"></textarea><button onclick="createTopic()">Создать тему</button></div><div class="box"><h2>📋 Все темы</h2><div id="allTopics"></div></div></div>
<div id="page-profile" style="display:none;"><div class="box"><h2>👤 Профиль</h2><input id="nickInput" placeholder="Твой ник"><button onclick="register()">Войти</button><p id="myRankText"></p><div id="myProfileCard"></div></div></div>
<div id="page-zayavki" style="display:none;"><div class="box"><h2>📝 Подать заявку</h2><button onclick="openZayavkaForm('Администратор')">На Администратора</button><button onclick="openZayavkaForm('Хелпер')">На Хелпера</button><button onclick="openZayavkaForm('Модератор')">На Модератора</button><button onclick="openZayavkaForm('Зам. Основателя')">На Зам. Основателя</button><button onclick="openZayavkaForm('Лидер')">На Лидера</button></div><div class="box"><h2>📋 Заявки</h2><div id="zayavkaList"></div></div></div>

<div class="box"><h2>💬 Сообщения</h2><div class="chat-box" id="chatBox"></div><div style="display:flex;gap:8px;"><input id="chatInput" placeholder="Написать..." style="flex:1;"><button onclick="sendChat()" style="width:110px!important;">Отправить</button></div></div>
<p style="font-size:12px;color:#888;text-align:center;">© 2026 KARATEL TEST — ФОРУМ</p>
</div>

<div class="modal" id="modalZayavka"><div class="modal-inner"><h2 id="zayavkaTitle">Подать заявку</h2><input id="zNick" placeholder="Твой ник"><input id="zAge" placeholder="Твой возраст"><textarea id="zWhy" placeholder="Почему именно ты?" rows="3"></textarea><button onclick="sendZayavka()">Отправить</button><button onclick="closeModal()" style="background:#333;">Закрыть</button></div></div>
<div class="modal" id="modalTopic"><div class="modal-inner"><h2 id="topicModalTitle"></h2><div id="topicModalBody"></div><div id="topicReplyBox"><input id="topicReplyInput" placeholder="Написать в тему..."><button onclick="sendTopicReply()">Отправить</button></div><p id="topicClosedMsg" style="display:none;color:#ff4444;font-weight:900;">🔒 Тема закрыта!</p><div id="topicAdminBtns"></div><button onclick="closeModal()" style="background:#333;margin-top:10px;">Закрыть</button></div></div>

<script>
const DB="https://karatel-test-1806a-default-rtdb.firebaseio.com";
function rankClass(r){ if(r==="Разработчик"||r==="Основатель")return "rank"; if(r==="Зам. Основателя")return "rank"; if(r==="Администратор")return "rank rank-admin"; if(r==="Хелпер"||r==="Модератор")return "rank rank-helper"; return "rank"; }
function getMyRank(){ return localStorage.getItem('karatel_rank')||"Игрок"; }
function getMyNick(){ return localStorage.getItem('karatel_nick')||""; }
function isAdmin(){ return ["Основатель","Разработчик","Зам. Основателя","Администратор"].includes(getMyRank()); }
if(!localStorage.getItem('karatel_nick')){ localStorage.setItem('karatel_nick','Wells_ohhotnik'); localStorage.setItem('karatel_rank','Разработчик'); }
function showPage(p,el){ document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active')); if(el)el.classList.add('active'); ['online','admin','create','profile','zayavki'].forEach(x=>{ document.getElementById('page-'+x).style.display=(x===p?'block':'none'); }); if(p==='online') loadOnline(); if(p==='admin') loadAdmin(); if(p==='create') loadTopics(); if(p==='zayavki') loadZayavki(); }
function closeModal(){ document.getElementById('modalZayavka').style.display='none'; document.getElementById('modalTopic').style.display='none'; }
function register(){ let nick=document.getElementById('nickInput').value.trim(); if(!nick) return alert('Введи ник!'); localStorage.setItem('karatel_nick',nick); let low=nick.toLowerCase(); if(low.includes('wells')||low.includes('ohhotnik')||low.includes('aks')||low.includes('акс')) localStorage.setItem('karatel_rank','Разработчик'); else if(low.includes('eva')||low.includes('marlowa')) localStorage.setItem('karatel_rank','Разработчик'); else if(!localStorage.getItem('karatel_rank')) localStorage.setItem('karatel_rank','Игрок'); alert('Привет, '+nick); updateProfile(); loadOnline(); }
function updateProfile(){ let nick=getMyNick()||"Гость"; let rank=getMyRank(); document.getElementById('myRankText').innerHTML="Ник: <b>"+nick+"</b> | Тег: <span class='"+rankClass(rank)+"'>"+rank+"</span>"; document.getElementById('myProfileCard').innerHTML=`<div class="user-card"><b>${nick}</b><br><span style="color:#2ecc71;">● В сети</span><br><span class="${rankClass(rank)}">${rank}</span></div>`; document.getElementById('nickInput').value=nick; }
updateProfile();
async function loadOnline(){ let list=document.getElementById('onlineList'); let base=[{nick:"Eva_Marlowa",rank:"Разработчик"},{nick:"Wells_ohhotnik",rank:"Разработчик"}]; try{ let r=await fetch(DB+"/online.json"); let d=await r.json()||{}; Object.values(d).slice(-20).forEach(u=>{ if(!base.find(b=>b.nick===u.nick)) base.push(u); }); }catch(e){} let me=getMyNick(); if(me && !base.find(b=>b.nick===me)) base.push({nick:me,rank:getMyRank()}); list.innerHTML=base.map(u=>`<div class="user-card"><b>${u.nick}</b><br><span style="color:#2ecc71;">● В сети</span><br><span class="${rankClass(u.rank||"Игрок")}">${u.rank||"Игрок"}</span></div>`).join(''); }
async function loadAdmin(){ document.getElementById('adminList').innerHTML=`<div class="user-card"><b>Wells_ohhotnik</b><br><span class="rank">РАЗРАБОТЧИК</span></div><div class="user-card"><b>Eva_Marlowa</b><br><span class="rank">РАЗРАБОТЧИК</span></div>`; }
async function createTopic(){ let title=document.getElementById('topicTitle').value.trim(); let text=document.getElementById('topicText').value.trim(); if(!title) return alert('Введи название!'); await fetch(DB+"/topics.json",{method:"POST",body:JSON.stringify({title:title,text:text,author:getMyNick()||"Гость",rank:getMyRank(),closed:false,time:Date.now()})}); alert('Тема создана!'); document.getElementById('topicTitle').value=""; document.getElementById('topicText').value=""; loadTopics(); }
async function loadTopics(){ let box=document.getElementById('allTopics'); let r=await fetch(DB+"/topics.json"); let data=await r.json()||{}; let entries=Object.entries(data); if(!entries.length){ box.innerHTML="Пока нет тем"; return; } box.innerHTML=entries.reverse().map(([id,t])=>`<div class="topic ${t.closed?'closed':''}" onclick="openTopic('${id}')"><b>${t.title}</b> ${t.closed?'<span style="color:#ff4444;">🔒 ЗАКРЫТА</span>':''}<br><span style="font-size:12px;color:#aaa;">Автор: ${t.author} | ${t.text||""}</span></div>`).join(''); }
let currentTopicId=null;
async function openTopic(id){ currentTopicId=id; let r=await fetch(DB+"/topics/"+id+".json"); let t=await r.json(); document.getElementById('topicModalTitle').innerText=t.title+(t.closed?" 🔒 ЗАКРЫТА":""); document.getElementById('topicModalBody').innerHTML=`<p>${t.text||""}</p><p style="font-size:12px;color:#aaa;">Автор: ${t.author}</p>`; if(t.closed){ document.getElementById('topicReplyBox').style.display='none'; document.getElementById('topicClosedMsg').style.display='block'; } else { document.getElementById('topicReplyBox').style.display='block'; document.getElementById('topicClosedMsg').style.display='none'; } if(isAdmin()){ document.getElementById('topicAdminBtns').innerHTML=t.closed?`<button onclick="toggleTopic('${id}',false)">🔓 Открыть тему</button>`:`<button onclick="toggleTopic('${id}',true)" style="background:#ff0000;">🔒 Закрыть тему</button>`; } else document.getElementById('topicAdminBtns').innerHTML=""; document.getElementById('modalTopic').style.display='block'; }
async function toggleTopic(id,close){ if(!isAdmin()) return alert('Только администрация!'); await fetch(DB+"/topics/"+id+".json",{method:"PATCH",body:JSON.stringify({closed:close})}); alert(close?"Тема закрыта!":"Тема открыта!"); closeModal(); loadTopics(); }
async function sendTopicReply(){ let inp=document.getElementById('topicReplyInput'); let txt=inp.value.trim(); if(!txt) return; let r=await fetch(DB+"/topics/"+currentTopicId+".json"); let t=await r.json(); if(t.closed) return alert('Тема закрыта!'); alert('Отправлено: '+txt); inp.value=""; }
async
